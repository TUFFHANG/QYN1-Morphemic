name: Bug Report
description: Report a bug or issue
title: "[Bug]: "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        ### Description  
        A clear and concise description of the bug.  
        ### Steps to reproduce  
        Steps to reproduce the behavior.  
        ### Expected behavior  
        What you expected to happen.  
        ### Screenshots  
        If applicable, add screenshots to help explain your problem.
